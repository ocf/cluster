apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: postgres-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postgres-operator
    helm.sh/chart: postgres-operator-1.15.1
  name: postgres-operator
  namespace: postgres-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: postgres-operator
      app.kubernetes.io/name: postgres-operator
  template:
    metadata:
      annotations:
        checksum/config: 3a1e26170b5044c10fbc0eed80ada562367ed7d26bcdce8e64d20593997c8fd8
      labels:
        app.kubernetes.io/instance: postgres-operator
        app.kubernetes.io/name: postgres-operator
    spec:
      affinity: {}
      containers:
      - env:
        - name: POSTGRES_OPERATOR_CONFIGURATION_OBJECT
          value: postgres-operator
        image: ghcr.io/zalando/postgres-operator:v1.15.1
        imagePullPolicy: IfNotPresent
        name: postgres-operator
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 250Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      nodeSelector: {}
      serviceAccountName: postgres-operator
      tolerations: []
