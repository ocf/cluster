apiVersion: apps/v1
kind: Deployment
metadata:
  name: templates
spec:
  replicas: 1
  selector:
    matchLabels:
      transpire.ocf.io/deployment: templates
  template:
    metadata:
      labels:
        transpire.ocf.io/deployment: templates
    spec:
      containers:
      - image: ghcr.io/ocf/templates:4ea4e236d7ca58cc75fb62a486566a26aab6517f
        imagePullPolicy: IfNotPresent
        name: main
        ports:
        - containerPort: 3000
